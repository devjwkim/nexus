# Strong rules loaded on hook registration (~@) and /boot (keep it short)

# Project Info
project.name=nexus
# project.author: alphanumeric, max 20 chars (e.g., jwkim, user123)
project.author=yourname
project.bot.useYn=n
project.bot.token=YOUR_BOT_TOKEN
project.bot.chatid=YOUR_CHAT_ID
project.bot.tmux.session=claude
project.repository=https://github.com/your_repo/nexus
project.description=Claude Code Task Management Template

# Global Strict Rules
global.strict.rule.1=Respond in English
global.strict.rule.2=Execute requested tasks exactly, no speculation
global.strict.rule.3=Ask if uncertain
global.strict.rule.4=Avoid unnecessary abstraction
global.strict.rule.5=Comments only when necessary
global.strict.rule.6=Concise and practical code
global.strict.rule.7=Avoid excessive error handling
global.strict.rule.8=No arbitrary commits (only on ~@ or /commit)

# Output Style (style name from .claude/output-styles/*.md)
global.output_style=buffer-style

# Global Variables (format: author_YYYYMMDDHHMMSS_xxx)
global.current_index=
global.current_completed=y
